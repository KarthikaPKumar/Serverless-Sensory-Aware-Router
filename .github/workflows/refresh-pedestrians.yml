name: Refresh Melbourne pedestrian observations
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/refresh_data.py
      - run: python3 -m unittest discover -s tests-real -p 'test_*.py'
      - run: node --test tests-real/*.test.mjs
      - name: Save validated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/pedestrians.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh timestamped pedestrian observations'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy refreshed snapshot
        id: deployment
        uses: actions/deploy-pages@v4
